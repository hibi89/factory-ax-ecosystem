name: Factory AX VERIFY synthetic QA (auto Linux; tagged Windows)
on:
  push:
    branches: [feature/data-verify]
    paths:
      - 'factoryax/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - '.github/workflows/verify-owner-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factoryax-verify-owner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    # Main registers the workflow; select the feature branch for actual tests.
    if: github.ref == 'refs/heads/feature/data-verify'
    timeout-minutes: 5
    # Source push runs Linux; tagged [windows-smoke] push also runs Windows. Max five minutes per job. Private billing usage remains metered.
    strategy:
      fail-fast: false
      matrix:
        # Private-repo push events use Linux only (bounded included-minute use).
        # Native Windows remains explicit owner dispatch until billing cap confirmed.
        # Windows auto-runs ONLY for a commit explicitly tagged [windows-smoke]; all other pushes Linux-only.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-smoke]')) && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        shell: bash
        run: python -m compileall -q factoryax tests scripts examples
      - name: Isolated synthetic regression (fail closed; bounded per-file timeout)
        shell: bash
        run: python scripts/run_ci_regressions.py --timeout 65
      - name: Build and verify unsigned candidate locally
        shell: bash
        run: |
          python scripts/build_candidate.py --output owner-qa-bundle
          python scripts/build_candidate.py --output owner-qa-bundle --verify
      - name: Synthetic four-role owner report / backup / restore (Windows included)
        shell: bash
        run: |
          python examples/make_reconcile_synthetic.py owner-qa-synthetic
          python -m factoryax --spec owner-qa-synthetic/approved.json --output owner-qa-report
          python -m factoryax --verify-report owner-qa-report
          python -m factoryax --backup-report owner-qa-report --output owner-qa-backup.zip
          python -m factoryax --restore-backup owner-qa-backup.zip --output owner-qa-restored
          python -m factoryax --verify-report owner-qa-restored
      - name: Windows CMD must forward BLOCKED exit=3 and preserve existing report
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A BLOCKED exit=3 is expected on the next invocation, not a CI failure.
          $PSNativeCommandUseErrorActionPreference = $false
          & .\owner-qa-bundle\RUN_VERIFY_WINDOWS.cmd --verify-report owner-qa-report
          if ($LASTEXITCODE -ne 0) { throw "Windows CMD verify exit code: $LASTEXITCODE" }
          $before = (Get-FileHash -Algorithm SHA256 owner-qa-report/result.json).Hash
          & .\owner-qa-bundle\RUN_VERIFY_WINDOWS.cmd --spec owner-qa-synthetic/approved.json --output owner-qa-report
          if ($LASTEXITCODE -ne 3) { throw "Windows CMD blocked exit should be 3, actual: $LASTEXITCODE" }
          $after = (Get-FileHash -Algorithm SHA256 owner-qa-report/result.json).Hash
          if ($before -ne $after) { throw "Blocked run modified existing report" }
          # GitHub's pwsh wrapper exits using the LAST native exit code. Consume
          # the expected BLOCKED=3 only after validating code and unchanged SHA.
          $global:LASTEXITCODE = 0
      - name: Native Windows Tk synthetic GUI widgets
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/gui_smoke.py
      - name: Real Tk widgets in virtual Linux display (not native Windows GUI)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a python scripts/gui_smoke.py
